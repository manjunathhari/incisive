name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      IMAGE: asia-south1-docker.pkg.dev/${{ vars.PROJECT_ID }}/incisive/incisive-app:${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check required repository variables
        env:
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          DEPLOY_SA: ${{ vars.DEPLOY_SA }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          IAP_AUDIENCE: ${{ vars.IAP_AUDIENCE }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
          GATE_MODEL: ${{ vars.GATE_MODEL }}
          MODEL_PRICES: ${{ vars.MODEL_PRICES }}
          USD_INR: ${{ vars.USD_INR }}
          GLOBAL_MONTHLY_CAP_INR: ${{ vars.GLOBAL_MONTHLY_CAP_INR }}
          UNPAYWALL_EMAIL: ${{ vars.UNPAYWALL_EMAIL }}
          AGENT_MODELS: ${{ vars.AGENT_MODELS }}
          RUN_LIMITS: ${{ vars.RUN_LIMITS }}
          QUICK_ENGINE: ${{ vars.QUICK_ENGINE }}
          FULL_ENGINE: ${{ vars.FULL_ENGINE }}
          COMPLETENESS: ${{ vars.COMPLETENESS }}
          TEMPORAL: ${{ vars.TEMPORAL }}
          TEMPORAL_MAX_TOKENS: ${{ vars.TEMPORAL_MAX_TOKENS }}
          STREAM: ${{ vars.STREAM }}
          QUICK_PARALLEL: ${{ vars.QUICK_PARALLEL }}
          NUMBER_COMPLETE: ${{ vars.NUMBER_COMPLETE }}
          ANSWER_LAYOUT: ${{ vars.ANSWER_LAYOUT }}
          INTRO: ${{ vars.INTRO }}
          INTRO_MODEL: ${{ vars.INTRO_MODEL }}
          GRAPH: ${{ vars.GRAPH }}
          GRAPH_MODEL: ${{ vars.GRAPH_MODEL }}
          GRAPH_FROM: ${{ vars.GRAPH_FROM }}
          HAS_NCBI_KEY: ${{ vars.HAS_NCBI_KEY }}
          CPU_ALWAYS: ${{ vars.CPU_ALWAYS }}
          MEMORY: ${{ vars.MEMORY }}
          GEMMA_URL: ${{ vars.GEMMA_URL }}
          EMBED_MODEL: ${{ vars.EMBED_MODEL }}
          MEMORY_TOPIC_MATCH: ${{ vars.MEMORY_TOPIC_MATCH }}
          MEMORY_GATE_MATCH: ${{ vars.MEMORY_GATE_MATCH }}
          CHAT: ${{ vars.CHAT }}
          CHAT_MODEL: ${{ vars.CHAT_MODEL }}
          CHAT_DAILY_LIMIT: ${{ vars.CHAT_DAILY_LIMIT }}
          CHAT_PRIOR: ${{ vars.CHAT_PRIOR }}
          CHAT_MIN_SCORE: ${{ vars.CHAT_MIN_SCORE }}
          HAS_GEMMA_KEY: ${{ vars.HAS_GEMMA_KEY }}
        run: |
          missing=0
          for v in PROJECT_ID WIF_PROVIDER DEPLOY_SA CLAUDE_MODEL IAP_AUDIENCE OWNER_EMAIL \
                   GATE_MODEL MODEL_PRICES USD_INR GLOBAL_MONTHLY_CAP_INR UNPAYWALL_EMAIL; do
            if [ -z "${!v//[[:space:]]/}" ]; then
              echo "::error::Repository variable vars.$v is empty or unset (see infra/README.md sections 6, 10 and 11)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          if ! printf '%s' "$MODEL_PRICES" | python3 -m json.tool >/dev/null 2>&1; then
            echo "::error::vars.MODEL_PRICES is not valid JSON (see infra/README.md section 10)"
            exit 1
          fi
          if ! [[ "$USD_INR" =~ ^[[:space:]]*[0-9]+(\.[0-9]+)?[[:space:]]*$ ]]; then
            echo "::error::vars.USD_INR must be a positive number, e.g. 92 (see infra/README.md section 10)"
            exit 1
          fi
          if ! [[ "$GLOBAL_MONTHLY_CAP_INR" =~ ^[[:space:]]*[1-9][0-9]*[[:space:]]*$ ]]; then
            echo "::error::vars.GLOBAL_MONTHLY_CAP_INR must be whole rupees, e.g. 9000 (see infra/README.md section 10)"
            exit 1
          fi
          # Same rule as the app's config: an address with @ and no spaces.
          if ! [[ "$UNPAYWALL_EMAIL" =~ ^[[:space:]]*[^[:space:]]*@[^[:space:]]*[[:space:]]*$ ]]; then
            echo "::error::vars.UNPAYWALL_EMAIL must be an email address (see infra/README.md section 11)"
            exit 1
          fi
          # Optional; when set each must be a JSON object whose keys are ones the
          # app accepts (for RUN_LIMITS also each mode's field names), so a typo
          # fails here. The app applies defaults otherwise and checks the values
          # themselves at startup.
          for v in AGENT_MODELS RUN_LIMITS; do
            [ -n "${!v//[[:space:]]/}" ] || continue
            case "$v" in
              AGENT_MODELS) allowed="frame search screen extract write check researcher writer extractor skeptic completeness temporal"; fields="" ;;
              RUN_LIMITS) allowed="quick focused"
                          fields="refinements screen_n use_n full_text limit_paise time_limit_s agent_limit_paise agent_time_limit_s researcher_turns skeptic_turns researcher_max_tokens skeptic_max_tokens extractor_max_tokens writer_max_tokens writer_time_allowance_s review_time_allowance_s extractor_concurrency" ;;
            esac
            if ! msg=$(printf '%s' "${!v}" | python3 -c '
          import json, sys
          allowed, fields = sys.argv[1].split(), sys.argv[2].split()
          try:
              v = json.loads(sys.stdin.read())
          except ValueError:
              sys.exit("is not valid JSON")
          if not isinstance(v, dict):
              sys.exit("must be a JSON object")
          bad = sorted(k for k in v if k not in allowed)
          if bad:
              sys.exit("has unknown key(s) " + ", ".join(bad) + "; allowed: " + ", ".join(allowed))
          for k, sub in v.items():
              if not fields:
                  break
              if not isinstance(sub, dict):
                  sys.exit("`" + k + "` must be a JSON object")
              bad = sorted(f for f in sub if f not in fields)
              if bad:
                  sys.exit("`" + k + "` has unknown field(s) " + ", ".join(bad) + "; allowed: " + ", ".join(fields))
          ' "$allowed" "$fields" 2>&1); then
              echo "::error::vars.$v $msg (see infra/README.md section 11)"
              exit 1
            fi
          done
          # Every agent model, configured or default, must be priced in
          # MODEL_PRICES: the app refuses to start otherwise, and failing here
          # saves a build and push. The defaults mirror AgentModels::default()
          # in crates/incisive-app/src/agent/llm.rs (Phase 2 steps and Phase 3
          # roles), so a default model with no price fails here too.
          if ! msg=$(python3 -c '
          import json, os, sys
          defaults = {"frame": "claude-sonnet-5-5", "search": "claude-sonnet-5-5",
                      "screen": "claude-haiku-5-5", "extract": "claude-sonnet-5-5",
                      "write": "claude-sonnet-5-5", "check": "claude-sonnet-5-5",
                      "researcher": "claude-opus-5-5", "writer": "claude-opus-5-5",
                      "extractor": "claude-sonnet-5-5", "skeptic": "claude-sonnet-5-5",
                      "completeness": "claude-sonnet-5-5",
                      "temporal": "claude-opus-5-5"}
          prices = json.loads(os.environ["MODEL_PRICES"])
          if not isinstance(prices, dict):
              sys.exit("vars.MODEL_PRICES must be a JSON object")
          raw = os.environ.get("AGENT_MODELS", "").strip()
          models = json.loads(raw) if raw else {}
          for step, default in defaults.items():
              model = models.get(step, default)
              # Same rule as the app: non-empty, no whitespace.
              if not isinstance(model, str) or not model or any(c.isspace() for c in model):
                  sys.exit("vars.AGENT_MODELS `" + step + "` must be a model name without spaces")
              if model not in prices:
                  sys.exit("vars.MODEL_PRICES has no price for " + model + " (agent step " + step + ")")
          ' 2>&1); then
            echo "::error::$msg (see infra/README.md sections 10 and 11)"
            exit 1
          fi
          # Optional Quick engine: unset (team), team or classic (the Phase 2
          # pipeline, the rollback switch). The app refuses anything else.
          # Only leading and trailing blanks are stripped, as the app trims.
          qe="${QUICK_ENGINE#"${QUICK_ENGINE%%[![:space:]]*}"}"
          qe="${qe%"${qe##*[![:space:]]}"}"
          case "$qe" in
            ""|team|classic) ;;
            *) echo "::error::vars.QUICK_ENGINE must be team or classic (see infra/README.md section 12)"; exit 1 ;;
          esac
          # Optional Full engine (Stage 3): the same rule. classic runs the
          # Phase 2 Focused pipeline.
          fe="${FULL_ENGINE#"${FULL_ENGINE%%[![:space:]]*}"}"
          fe="${fe%"${fe##*[![:space:]]}"}"
          case "$fe" in
            ""|team|classic) ;;
            *) echo "::error::vars.FULL_ENGINE must be team or classic (see infra/README.md section 12)"; exit 1 ;;
          esac
          # Optional completeness review (Stage 4b, Full only): unset (on), on or
          # off (the rollback switch). The same trim as the engines.
          cr="${COMPLETENESS#"${COMPLETENESS%%[![:space:]]*}"}"
          cr="${cr%"${cr##*[![:space:]]}"}"
          case "$cr" in
            ""|on|off) ;;
            *) echo "::error::vars.COMPLETENESS must be on or off (see infra/README.md section 12)"; exit 1 ;;
          esac
          # Optional temporal expert opinion (T2/T3, Full only): unset (off), off
          # or on. The same trim. TEMPORAL_MAX_TOKENS: unset or 2000-32000.
          tp="${TEMPORAL#"${TEMPORAL%%[![:space:]]*}"}"
          tp="${tp%"${tp##*[![:space:]]}"}"
          case "$tp" in
            ""|on|off) ;;
            *) echo "::error::vars.TEMPORAL must be on or off (see infra/README.md section 13)"; exit 1 ;;
          esac
          tm="${TEMPORAL_MAX_TOKENS#"${TEMPORAL_MAX_TOKENS%%[![:space:]]*}"}"
          tm="${tm%"${tm##*[![:space:]]}"}"
          if [ -n "$tm" ] && ! { [[ "$tm" =~ ^[0-9]+$ ]] && [ "$tm" -ge 2000 ] && [ "$tm" -le 32000 ]; }; then
            echo "::error::vars.TEMPORAL_MAX_TOKENS must be a whole number from 2000 to 32000 (see infra/README.md section 13)"; exit 1
          fi
          # Optional writer streaming (infra/README.md section 15): unset (on), on or
          # off. The same trim.
          st="${STREAM#"${STREAM%%[![:space:]]*}"}"
          st="${st%"${st##*[![:space:]]}"}"
          case "$st" in
            ""|on|off) ;;
            *) echo "::error::vars.STREAM must be on or off (see infra/README.md section 15)"; exit 1 ;;
          esac
          # Optional Quick answer in four parts (infra/README.md section 15): unset
          # (off), off or on. The same trim.
          qp="${QUICK_PARALLEL#"${QUICK_PARALLEL%%[![:space:]]*}"}"
          qp="${qp%"${qp##*[![:space:]]}"}"
          case "$qp" in
            ""|on|off) ;;
            *) echo "::error::vars.QUICK_PARALLEL must be on or off (see infra/README.md section 15)"; exit 1 ;;
          esac
          # Optional number completeness (infra/README.md section 15): unset (off),
          # off or on. The same trim.
          nc="${NUMBER_COMPLETE#"${NUMBER_COMPLETE%%[![:space:]]*}"}"
          nc="${nc%"${nc##*[![:space:]]}"}"
          case "$nc" in
            ""|on|off) ;;
            *) echo "::error::vars.NUMBER_COMPLETE must be on or off (see infra/README.md section 15)"; exit 1 ;;
          esac
          # Optional answer page layout (infra/README.md section 15): unset (off),
          # off or on. The same trim. UI only.
          al="${ANSWER_LAYOUT#"${ANSWER_LAYOUT%%[![:space:]]*}"}"
          al="${al%"${al##*[![:space:]]}"}"
          case "$al" in
            ""|on|off) ;;
            *) echo "::error::vars.ANSWER_LAYOUT must be on or off (see infra/README.md section 15)"; exit 1 ;;
          esac
          # Optional introduction agent (infra/README.md section 14): unset (off), off
          # or on. The same trim. When on, INTRO_MODEL (default claude-sonnet-5-5,
          # mirrors runs::intro::DEFAULT_MODEL) must be priced, as the app refuses
          # to start otherwise. With it off the model is never called.
          ia="${INTRO#"${INTRO%%[![:space:]]*}"}"
          ia="${ia%"${ia##*[![:space:]]}"}"
          case "$ia" in
            ""|on|off) ;;
            *) echo "::error::vars.INTRO must be on or off (see infra/README.md section 14)"; exit 1 ;;
          esac
          im="${INTRO_MODEL#"${INTRO_MODEL%%[![:space:]]*}"}"
          im="${im%"${im##*[![:space:]]}"}"
          case "$im" in
            *[[:space:]]*) echo "::error::vars.INTRO_MODEL must be a model name without spaces (see infra/README.md section 14)"; exit 1 ;;
          esac
          # Optional knowledge graph (infra/README.md, "Knowledge graph"): GRAPH unset
          # (off), off or on; the same trim. When on, GRAPH_FROM must be a real date
          # (YYYY-MM-DD) and GRAPH_MODEL (default claude-sonnet-5-5, mirrors
          # graph::settings::DEFAULT_MODEL) must be priced, as the app refuses to
          # start otherwise. With it off nothing is called.
          gr="${GRAPH#"${GRAPH%%[![:space:]]*}"}"
          gr="${gr%"${gr##*[![:space:]]}"}"
          case "$gr" in
            ""|on|off) ;;
            *) echo "::error::vars.GRAPH must be on or off (see infra/README.md, Knowledge graph)"; exit 1 ;;
          esac
          gm="${GRAPH_MODEL#"${GRAPH_MODEL%%[![:space:]]*}"}"
          gm="${gm%"${gm##*[![:space:]]}"}"
          case "$gm" in
            *[[:space:]]*) echo "::error::vars.GRAPH_MODEL must be a model name without spaces (see infra/README.md, Knowledge graph)"; exit 1 ;;
          esac
          gf="${GRAPH_FROM#"${GRAPH_FROM%%[![:space:]]*}"}"
          gf="${gf%"${gf##*[![:space:]]}"}"
          if [ -n "$gf" ] && ! { [[ "$gf" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && python3 -c 'import sys, datetime; datetime.date.fromisoformat(sys.argv[1])' "$gf" 2>/dev/null; }; then
            echo "::error::vars.GRAPH_FROM must be a date as YYYY-MM-DD (see infra/README.md, Knowledge graph)"; exit 1
          fi
          if [ "$gr" = "on" ] && [ -z "$gf" ]; then
            echo "::error::vars.GRAPH=on needs vars.GRAPH_FROM, a date as YYYY-MM-DD (see infra/README.md, Knowledge graph)"; exit 1
          fi
          if [ "$ia" = "on" ] && ! INTRO_MODEL_CHECK="${im:-claude-sonnet-5-5}" python3 -c '
          import json, os, sys
          sys.exit(0 if os.environ["INTRO_MODEL_CHECK"] in json.loads(os.environ["MODEL_PRICES"]) else 1)
          '; then
            echo "::error::vars.MODEL_PRICES has no price for INTRO_MODEL ${im:-claude-sonnet-5-5} (see infra/README.md section 14)"; exit 1
          fi
          if [ "$gr" = "on" ] && ! GRAPH_MODEL_CHECK="${gm:-claude-sonnet-5-5}" python3 -c '
          import json, os, sys
          sys.exit(0 if os.environ["GRAPH_MODEL_CHECK"] in json.loads(os.environ["MODEL_PRICES"]) else 1)
          '; then
            echo "::error::vars.MODEL_PRICES has no price for GRAPH_MODEL ${gm:-claude-sonnet-5-5} (see infra/README.md, Knowledge graph)"; exit 1
          fi
          # Optional switches: unset, true or false (a typo must not silently mean off).
          # Optional memory layer (infra/README.md, "Memory layer"): MEMORY unset
          # (off), off or on; GEMMA_URL unset or https://; thresholds 0-1.
          mm="${MEMORY//[[:space:]]/}"
          case "$mm" in
            ""|on|off) ;;
            *) echo "::error::vars.MEMORY must be on or off (see infra/README.md, Memory layer)"; exit 1 ;;
          esac
          gu="${GEMMA_URL//[[:space:]]/}"
          if [ -n "$gu" ] && [[ "$gu" != https://* ]]; then
            echo "::error::vars.GEMMA_URL must start with https:// (see infra/README.md, Memory layer)"; exit 1
          fi
          for v in MEMORY_TOPIC_MATCH MEMORY_GATE_MATCH; do
            t="${!v//[[:space:]]/}"
            if [ -n "$t" ] && ! python3 -c 'import sys; x=float(sys.argv[1]); assert 0.0 <= x <= 1.0' "$t" 2>/dev/null; then
              echo "::error::vars.$v must be a number from 0 to 1 (see infra/README.md, Memory layer)"; exit 1
            fi
          done
          # Evidence chat (infra/README.md, "Evidence chat"): CHAT and CHAT_PRIOR unset,
          # off or on; CHAT_DAILY_LIMIT a whole number from 1; CHAT_MIN_SCORE 0-1.
          for v in CHAT CHAT_PRIOR; do
            case "${!v//[[:space:]]/}" in
              ""|on|off) ;;
              *) echo "::error::vars.$v must be on or off (see infra/README.md, Evidence chat)"; exit 1 ;;
            esac
          done
          # A reply is written by a task after the request has returned; with the CPU
          # throttled between requests it stalls, so chat needs CPU_ALWAYS.
          if [ "${CHAT//[[:space:]]/}" = "on" ] && [ "${CPU_ALWAYS//[[:space:]]/}" != "true" ]; then
            echo "::error::vars.CHAT=on needs vars.CPU_ALWAYS=true (see infra/README.md, Evidence chat)"; exit 1
          fi
          cl="${CHAT_DAILY_LIMIT//[[:space:]]/}"
          if [ -n "$cl" ] && ! { [[ "$cl" =~ ^[0-9]+$ ]] && [ "$cl" -ge 1 ]; }; then
            echo "::error::vars.CHAT_DAILY_LIMIT must be a whole number of 1 or more (see infra/README.md, Evidence chat)"; exit 1
          fi
          cs="${CHAT_MIN_SCORE//[[:space:]]/}"
          if [ -n "$cs" ] && ! python3 -c 'import sys; x=float(sys.argv[1]); assert 0.0 <= x <= 1.0' "$cs" 2>/dev/null; then
            echo "::error::vars.CHAT_MIN_SCORE must be a number from 0 to 1 (see infra/README.md, Evidence chat)"; exit 1
          fi
          if [ "${HAS_GEMMA_KEY//[[:space:]]/}" = "true" ] && [ -z "$gu" ]; then
            echo "::error::vars.HAS_GEMMA_KEY is true but vars.GEMMA_URL is empty (see infra/README.md, Memory layer)"; exit 1
          fi
          for v in HAS_NCBI_KEY CPU_ALWAYS HAS_GEMMA_KEY; do
            case "${!v//[[:space:]]/}" in
              ""|true|false) ;;
              *) echo "::error::vars.$v must be true or false (see infra/README.md section 11)"; exit 1 ;;
            esac
          done
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet
      # `gcloud auth configure-docker` writes ~/.docker/config.json. The
      # docker-container buildx driver (setup-buildx-action default) reads that
      # file on the client side when it pushes, so registry auth keeps working;
      # push happens in the build step and replaces the separate `docker push`.
      - uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=incisive
          # Push a plain image, as `docker push` did: no attestation index.
          provenance: false
          sbom: false
      - name: Deploy to Cloud Run
        env:
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          IAP_AUDIENCE: ${{ vars.IAP_AUDIENCE }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
          GATE_MODEL: ${{ vars.GATE_MODEL }}
          MODEL_PRICES: ${{ vars.MODEL_PRICES }}
          USD_INR: ${{ vars.USD_INR }}
          GLOBAL_MONTHLY_CAP_INR: ${{ vars.GLOBAL_MONTHLY_CAP_INR }}
          UNPAYWALL_EMAIL: ${{ vars.UNPAYWALL_EMAIL }}
          AGENT_MODELS: ${{ vars.AGENT_MODELS }}
          RUN_LIMITS: ${{ vars.RUN_LIMITS }}
          QUICK_ENGINE: ${{ vars.QUICK_ENGINE }}
          FULL_ENGINE: ${{ vars.FULL_ENGINE }}
          COMPLETENESS: ${{ vars.COMPLETENESS }}
          TEMPORAL: ${{ vars.TEMPORAL }}
          TEMPORAL_MAX_TOKENS: ${{ vars.TEMPORAL_MAX_TOKENS }}
          STREAM: ${{ vars.STREAM }}
          QUICK_PARALLEL: ${{ vars.QUICK_PARALLEL }}
          NUMBER_COMPLETE: ${{ vars.NUMBER_COMPLETE }}
          ANSWER_LAYOUT: ${{ vars.ANSWER_LAYOUT }}
          INTRO: ${{ vars.INTRO }}
          INTRO_MODEL: ${{ vars.INTRO_MODEL }}
          GRAPH: ${{ vars.GRAPH }}
          GRAPH_MODEL: ${{ vars.GRAPH_MODEL }}
          GRAPH_FROM: ${{ vars.GRAPH_FROM }}
          HAS_NCBI_KEY: ${{ vars.HAS_NCBI_KEY }}
          CPU_ALWAYS: ${{ vars.CPU_ALWAYS }}
          MEMORY: ${{ vars.MEMORY }}
          GEMMA_URL: ${{ vars.GEMMA_URL }}
          EMBED_MODEL: ${{ vars.EMBED_MODEL }}
          MEMORY_TOPIC_MATCH: ${{ vars.MEMORY_TOPIC_MATCH }}
          MEMORY_GATE_MATCH: ${{ vars.MEMORY_GATE_MATCH }}
          CHAT: ${{ vars.CHAT }}
          CHAT_MODEL: ${{ vars.CHAT_MODEL }}
          CHAT_DAILY_LIMIT: ${{ vars.CHAT_DAILY_LIMIT }}
          CHAT_PRIOR: ${{ vars.CHAT_PRIOR }}
          CHAT_MIN_SCORE: ${{ vars.CHAT_MIN_SCORE }}
          HAS_GEMMA_KEY: ${{ vars.HAS_GEMMA_KEY }}
        run: |
          set -euo pipefail
          # MODEL_PRICES is JSON and contains commas, which `--set-env-vars=A=x,B=y`
          # would split. Use an env-vars file instead, with each value written as a
          # JSON string (a JSON string is a valid YAML double-quoted scalar), so
          # commas and quotes survive. Values come from `env:`, never from inline
          # expressions in the script.
          envfile="$(mktemp)"
          trap 'rm -f "$envfile"' EXIT
          python3 - "$envfile" <<'PY'
          import json, os, sys
          names = ["CLAUDE_MODEL", "IAP_AUDIENCE", "OWNER_EMAIL", "GATE_MODEL",
                   "MODEL_PRICES", "USD_INR", "GLOBAL_MONTHLY_CAP_INR", "UNPAYWALL_EMAIL"]
          # Optional: written only when set, so the app's defaults apply otherwise.
          optional = ["AGENT_MODELS", "RUN_LIMITS", "QUICK_ENGINE", "FULL_ENGINE", "COMPLETENESS"]
          # Temporal T2/T3 (infra/README.md section 13): optional too.
          optional += ["TEMPORAL", "TEMPORAL_MAX_TOKENS"]
          # Writer streaming (infra/README.md section 15): optional too.
          optional += ["STREAM"]
          # Quick in four parts (infra/README.md section 15): optional too.
          optional += ["QUICK_PARALLEL"]
          # Number completeness (infra/README.md section 15): optional too.
          optional += ["NUMBER_COMPLETE"]
          # The answer page's layout (infra/README.md section 15): optional too.
          optional += ["ANSWER_LAYOUT"]
          # The introduction agent (infra/README.md section 14): optional too.
          optional += ["INTRO", "INTRO_MODEL"]
          # The knowledge graph (infra/README.md, "Knowledge graph"): optional too.
          optional += ["GRAPH", "GRAPH_MODEL", "GRAPH_FROM"]
          # Memory layer: optional too (GEMMA_AUTH is a secret, below).
          optional += ["MEMORY", "GEMMA_URL", "EMBED_MODEL", "MEMORY_TOPIC_MATCH", "MEMORY_GATE_MATCH"]
          # Evidence chat: optional too; it reuses GEMMA_URL and GEMMA_AUTH.
          optional += ["CHAT", "CHAT_MODEL", "CHAT_DAILY_LIMIT", "CHAT_PRIOR", "CHAT_MIN_SCORE"]
          lines = [f"APP_ENV: {json.dumps('prod')}"]
          lines += [f"{n}: {json.dumps(os.environ[n].strip())}" for n in names]
          lines += [f"{n}: {json.dumps(os.environ[n].strip())}"
                    for n in optional if os.environ.get(n, "").strip()]
          open(sys.argv[1], "w").write("\n".join(lines) + "\n")
          PY
          # Flags built from the switches (infra/README.md section 11). --set-secrets
          # replaces the whole list, so turning HAS_NCBI_KEY off removes the key.
          HAS_NCBI_KEY="${HAS_NCBI_KEY//[[:space:]]/}"
