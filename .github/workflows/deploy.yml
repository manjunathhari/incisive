name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      IMAGE: asia-south1-docker.pkg.dev/${{ vars.PROJECT_ID }}/incisive/incisive-app:${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check required repository variables
        env:
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          DEPLOY_SA: ${{ vars.DEPLOY_SA }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          IAP_AUDIENCE: ${{ vars.IAP_AUDIENCE }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
          GATE_MODEL: ${{ vars.GATE_MODEL }}
          MODEL_PRICES: ${{ vars.MODEL_PRICES }}
          USD_INR: ${{ vars.USD_INR }}
          GLOBAL_MONTHLY_CAP_INR: ${{ vars.GLOBAL_MONTHLY_CAP_INR }}
          UNPAYWALL_EMAIL: ${{ vars.UNPAYWALL_EMAIL }}
          AGENT_MODELS: ${{ vars.AGENT_MODELS }}
          RUN_LIMITS: ${{ vars.RUN_LIMITS }}
          HAS_NCBI_KEY: ${{ vars.HAS_NCBI_KEY }}
          CPU_ALWAYS: ${{ vars.CPU_ALWAYS }}
        run: |
          missing=0
          for v in PROJECT_ID WIF_PROVIDER DEPLOY_SA CLAUDE_MODEL IAP_AUDIENCE OWNER_EMAIL \
                   GATE_MODEL MODEL_PRICES USD_INR GLOBAL_MONTHLY_CAP_INR UNPAYWALL_EMAIL; do
            if [ -z "${!v//[[:space:]]/}" ]; then
              echo "::error::Repository variable vars.$v is empty or unset (see infra/README.md sections 6, 10 and 11)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          if ! printf '%s' "$MODEL_PRICES" | python3 -m json.tool >/dev/null 2>&1; then
            echo "::error::vars.MODEL_PRICES is not valid JSON (see infra/README.md section 10)"
            exit 1
          fi
          if ! [[ "$USD_INR" =~ ^[[:space:]]*[0-9]+(\.[0-9]+)?[[:space:]]*$ ]]; then
            echo "::error::vars.USD_INR must be a positive number, e.g. 92 (see infra/README.md section 10)"
            exit 1
          fi
          if ! [[ "$GLOBAL_MONTHLY_CAP_INR" =~ ^[[:space:]]*[1-9][0-9]*[[:space:]]*$ ]]; then
            echo "::error::vars.GLOBAL_MONTHLY_CAP_INR must be whole rupees, e.g. 9000 (see infra/README.md section 10)"
            exit 1
          fi
          # Same rule as the app's config: an address with @ and no spaces.
          if ! [[ "$UNPAYWALL_EMAIL" =~ ^[[:space:]]*[^[:space:]]*@[^[:space:]]*[[:space:]]*$ ]]; then
            echo "::error::vars.UNPAYWALL_EMAIL must be an email address (see infra/README.md section 11)"
            exit 1
          fi
          # Optional; when set each must be a JSON object whose keys are ones the
          # app accepts (for RUN_LIMITS also each mode's field names), so a typo
          # fails here. The app applies defaults otherwise and checks the values
          # themselves at startup.
          for v in AGENT_MODELS RUN_LIMITS; do
            [ -n "${!v//[[:space:]]/}" ] || continue
            case "$v" in
              AGENT_MODELS) allowed="frame search screen extract write check"; fields="" ;;
              RUN_LIMITS) allowed="quick focused"
                          fields="refinements screen_n use_n full_text limit_paise time_limit_s agent_limit_paise agent_time_limit_s researcher_turns skeptic_turns researcher_max_tokens skeptic_max_tokens extractor_max_tokens writer_max_tokens" ;;
            esac
            if ! msg=$(printf '%s' "${!v}" | python3 -c '
          import json, sys
          allowed, fields = sys.argv[1].split(), sys.argv[2].split()
          try:
              v = json.loads(sys.stdin.read())
          except ValueError:
              sys.exit("is not valid JSON")
          if not isinstance(v, dict):
              sys.exit("must be a JSON object")
          bad = sorted(k for k in v if k not in allowed)
          if bad:
              sys.exit("has unknown key(s) " + ", ".join(bad) + "; allowed: " + ", ".join(allowed))
          for k, sub in v.items():
              if not fields:
                  break
              if not isinstance(sub, dict):
                  sys.exit("`" + k + "` must be a JSON object")
              bad = sorted(f for f in sub if f not in fields)
              if bad:
                  sys.exit("`" + k + "` has unknown field(s) " + ", ".join(bad) + "; allowed: " + ", ".join(fields))
          ' "$allowed" "$fields" 2>&1); then
              echo "::error::vars.$v $msg (see infra/README.md section 11)"
              exit 1
            fi
          done
          # Every agent model, configured or default, must be priced in
          # MODEL_PRICES: the app refuses to start otherwise, and failing here
          # saves a build and push. The defaults mirror DEFAULT_MODEL and
          # DEFAULT_SCREEN_MODEL in crates/incisive-app/src/agent/llm.rs.
          if ! msg=$(python3 -c '
          import json, os, sys
          defaults = {"frame": "claude-sonnet-5-5", "search": "claude-sonnet-5-5",
                      "screen": "claude-haiku-5-5", "extract": "claude-sonnet-5-5",
                      "write": "claude-sonnet-5-5", "check": "claude-sonnet-5-5"}
          prices = json.loads(os.environ["MODEL_PRICES"])
          if not isinstance(prices, dict):
              sys.exit("vars.MODEL_PRICES must be a JSON object")
          raw = os.environ.get("AGENT_MODELS", "").strip()
          models = json.loads(raw) if raw else {}
          for step, default in defaults.items():
              model = models.get(step, default)
              # Same rule as the app: non-empty, no whitespace.
              if not isinstance(model, str) or not model or any(c.isspace() for c in model):
                  sys.exit("vars.AGENT_MODELS `" + step + "` must be a model name without spaces")
              if model not in prices:
                  sys.exit("vars.MODEL_PRICES has no price for " + model + " (agent step " + step + ")")
          ' 2>&1); then
            echo "::error::$msg (see infra/README.md sections 10 and 11)"
            exit 1
          fi
          # Optional switches: unset, true or false (a typo must not silently mean off).
          for v in HAS_NCBI_KEY CPU_ALWAYS; do
            case "${!v//[[:space:]]/}" in
              ""|true|false) ;;
              *) echo "::error::vars.$v must be true or false (see infra/README.md section 11)"; exit 1 ;;
            esac
          done
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet
      # `gcloud auth configure-docker` writes ~/.docker/config.json. The
      # docker-container buildx driver (setup-buildx-action default) reads that
      # file on the client side when it pushes, so registry auth keeps working;
      # push happens in the build step and replaces the separate `docker push`.
      - uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=incisive
          # Push a plain image, as `docker push` did: no attestation index.
          provenance: false
          sbom: false
      - name: Deploy to Cloud Run
        env:
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          IAP_AUDIENCE: ${{ vars.IAP_AUDIENCE }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
          GATE_MODEL: ${{ vars.GATE_MODEL }}
          MODEL_PRICES: ${{ vars.MODEL_PRICES }}
          USD_INR: ${{ vars.USD_INR }}
          GLOBAL_MONTHLY_CAP_INR: ${{ vars.GLOBAL_MONTHLY_CAP_INR }}
          UNPAYWALL_EMAIL: ${{ vars.UNPAYWALL_EMAIL }}
          AGENT_MODELS: ${{ vars.AGENT_MODELS }}
          RUN_LIMITS: ${{ vars.RUN_LIMITS }}
          HAS_NCBI_KEY: ${{ vars.HAS_NCBI_KEY }}
          CPU_ALWAYS: ${{ vars.CPU_ALWAYS }}
        run: |
          set -euo pipefail
          # MODEL_PRICES is JSON and contains commas, which `--set-env-vars=A=x,B=y`
          # would split. Use an env-vars file instead, with each value written as a
          # JSON string (a JSON string is a valid YAML double-quoted scalar), so
          # commas and quotes survive. Values come from `env:`, never from inline
          # expressions in the script.
          envfile="$(mktemp)"
          trap 'rm -f "$envfile"' EXIT
          python3 - "$envfile" <<'PY'
          import json, os, sys
          names = ["CLAUDE_MODEL", "IAP_AUDIENCE", "OWNER_EMAIL", "GATE_MODEL",
                   "MODEL_PRICES", "USD_INR", "GLOBAL_MONTHLY_CAP_INR", "UNPAYWALL_EMAIL"]
          # Optional: written only when set, so the app's defaults apply otherwise.
          optional = ["AGENT_MODELS", "RUN_LIMITS"]
          lines = [f"APP_ENV: {json.dumps('prod')}"]
          lines += [f"{n}: {json.dumps(os.environ[n].strip())}" for n in names]
          lines += [f"{n}: {json.dumps(os.environ[n].strip())}"
                    for n in optional if os.environ.get(n, "").strip()]
          open(sys.argv[1], "w").write("\n".join(lines) + "\n")
          PY
          # Flags built from the switches (infra/README.md section 11). --set-secrets
          # replaces the whole list, so turning HAS_NCBI_KEY off removes the key.
          HAS_NCBI_KEY="${HAS_NCBI_KEY//[[:space:]]/}"
          CPU_ALWAYS="${CPU_ALWAYS//[[:space:]]/}"
          secrets="ANTHROPIC_API_KEY=anthropic-api-key:latest,DATABASE_URL=database-url:latest"
          if [ "$HAS_NCBI_KEY" = "true" ]; then
            secrets="${secrets},NCBI_API_KEY=ncbi-api-key:latest"
          fi
          # CPU always on lets a run keep working after its HTTP response; it
          # costs more, so the owner turns it on after checking the price.
          if [ "$CPU_ALWAYS" = "true" ]; then
            cpu_flag="--no-cpu-throttling"
          else
            cpu_flag="--cpu-throttling"
          fi
          gcloud run deploy incisive-app --image="$IMAGE" --region=asia-south1 \
            --project="$PROJECT_ID" \
            --service-account="incisive-run@${PROJECT_ID}.iam.gserviceaccount.com" \
            --set-secrets="$secrets" \
            --env-vars-file="$envfile" \
            --timeout=3600 --min-instances=0 --max-instances=3 --cpu=1 --memory=512Mi \
            "$cpu_flag" --no-allow-unauthenticated
          # Access is gated by Google sign-in (Identity-Aware Proxy), enabled once on the
          # service (infra/README.md section 8). The IAP setting persists across deploys;
          # --no-allow-unauthenticated guarantees a deploy can never reopen the service.
