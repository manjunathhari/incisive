name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # RUSTSEC-2023-0071 (rsa) is in Cargo.lock only via sqlx-mysql, which is never compiled
      # (cargo tree -i rsa is empty); no fixed version exists.
      - run: cargo install cargo-audit --locked && cargo audit --ignore RUSTSEC-2023-0071

  container:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        shell: bash
        run: |
          set -o pipefail
          if ! docker build --progress=plain -t incisive-app:ci . 2>&1 | tee build.log; then
            msg=$(tail -n 80 build.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=docker build::${msg}"
            exit 1
          fi
      - name: smoke test image
        shell: bash
        run: |
          set -euo pipefail
          cid=$(docker run -d -p 8080:8080 \
            -e ANTHROPIC_API_KEY=x -e CLAUDE_MODEL=x \
            -e OWNER_EMAIL=owner@example.com \
            -e IAP_AUDIENCE=/projects/0/locations/asia-south1/services/test \
            -e DATABASE_URL=postgres://u:p@127.0.0.1:1/x incisive-app:ci)
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then docker logs "$cid" || true; fi
            docker rm -f "$cid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          up=0
          for _ in $(seq 1 30); do
            if curl -fsS localhost:8080/health >/dev/null 2>&1; then up=1; break; fi
            sleep 1
          done
          [ "$up" = 1 ] || { echo "::error::app did not become healthy within 30s"; exit 1; }
          body=$(curl -fsS localhost:8080/health)
          [ "$body" = "ok" ] || { echo "::error::/health returned '$body'"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/ready)
          [ "$code" = "503" ] || { echo "::error::/ready returned $code, expected 503"; exit 1; }
          curl -fsS localhost:8080/ | grep -q 'Cut to the evidence.' \
            || { echo "::error::home page missing tagline"; exit 1; }
