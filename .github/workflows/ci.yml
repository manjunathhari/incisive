name: CI

on:
  push:
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

# Actions minutes are limited on a private repository: a newer push to the same
# branch cancels the run still in progress, and docs-only changes don't run CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # The hosted runner ships ~14 GB free; Rust test builds need more. Remove
      # preinstalled toolchains this job never uses.
      - name: free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Apply the migrations once, before any test binary starts, so parallel
      # tests never race the first migration on the empty CI database. This
      # reuses an existing test (no extra tool, no reliance on binary order);
      # every later migrate() call is then a no-op.
      - name: apply migrations to the CI database
        run: cargo test -p incisive-app --test db migrations_apply_and_ready_is_true -- --exact
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # --no-fail-fast runs every test binary; failing tests and panic lines are
      # also emitted as annotations so they are readable without the raw log.
      - name: cargo test --workspace
        shell: bash
        run: |
          set +e
          cargo test --workspace --no-fail-fast 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E -- "--- FAILED|panicked at|^thread '.*' panicked|assertion|left:|right:|exceeded|test result: FAILED|error: test failed|error(\[E[0-9]+\])?:|process didn't exit successfully|No space left|signal: " test.log \
              | head -40 | while IFS= read -r line; do echo "::error::${line//%/%25}"; done
            # Also surface the tail of the log, so a failure with no matching
            # line (a crash, linker error, or OOM) is still readable.
            tail -n 25 test.log | while IFS= read -r line; do echo "::warning::${line//%/%25}"; done
          fi
          exit "$status"
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # RUSTSEC-2023-0071 (rsa) is in Cargo.lock only via sqlx-mysql, which is never compiled
      # (cargo tree -i rsa is empty); no fixed version exists.
      - run: cargo install cargo-audit --locked && cargo audit --ignore RUSTSEC-2023-0071

  container:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The cache is shared with the Deploy workflow (same scope), so a deploy
      # after a green CI reuses these layers. `load: true` puts the image in the
      # local daemon for the smoke test. On failure the action itself raises an
      # error annotation carrying buildx's error output.
      - name: docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: incisive-app:ci
          cache-from: type=gha,scope=incisive
          cache-to: type=gha,mode=max,scope=incisive
          provenance: false
      - name: smoke test image
        shell: bash
        run: |
          set -euo pipefail
          # Prod mode with dummy values: proves prod config parsing accepts every
          # required variable (the image sets APP_ENV=prod). Prod requires both
          # GATE_MODEL and CLAUDE_MODEL to be priced in MODEL_PRICES.
          cid=$(docker run -d -p 8080:8080 \
            -e APP_ENV=prod \
            -e ANTHROPIC_API_KEY=sk-ant-FAKE-smoke-test-not-a-real-key \
            -e CLAUDE_MODEL=claude-sonnet-5-5 -e GATE_MODEL=claude-haiku-5-5 \
            -e OWNER_EMAIL=owner@example.com -e UNPAYWALL_EMAIL=ci@example.invalid \
            -e MODEL_PRICES='{"claude-haiku-5-5":{"input":1,"output":5},"claude-sonnet-5-5":{"input":3,"output":15}}' \
            -e USD_INR=88 -e GLOBAL_MONTHLY_CAP_INR=10000 \
            -e IAP_AUDIENCE=/projects/0/locations/asia-south1/services/test \
            -e DATABASE_URL=postgres://u:p@127.0.0.1:1/x incisive-app:ci)
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then docker logs "$cid" || true; fi
            docker rm -f "$cid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          up=0
          for _ in $(seq 1 30); do
            if curl -fsS localhost:8080/health >/dev/null 2>&1; then up=1; break; fi
            sleep 1
          done
          [ "$up" = 1 ] || { echo "::error::app did not become healthy within 30s"; exit 1; }
          body=$(curl -fsS localhost:8080/health)
          [ "$body" = "ok" ] || { echo "::error::/health returned '$body'"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/ready)
          [ "$code" = "503" ] || { echo "::error::/ready returned $code, expected 503"; exit 1; }
          curl -fsS localhost:8080/ | grep -q 'Cut to the evidence.' \
            || { echo "::error::home page missing tagline"; exit 1; }
          curl -fsS localhost:8080/ | grep -q '<textarea id="question"' \
            || { echo "::error::home page missing question box"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' -d '{"question":"hello"}' \
            localhost:8080/api/ask)
          [ "$code" = "401" ] || { echo "::error::POST /api/ask without identity returned $code, expected 401"; exit 1; }
