name: Diag hydration
on:
  push:
    branches: [diag/hydration]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t incisive-app:diag .
      - name: run app and probe
        shell: bash
        run: |
          docker run -d --network host \
            -e APP_ENV=dev -e LEPTOS_SITE_ADDR=0.0.0.0:8080 \
            -e ANTHROPIC_API_KEY=sk-ant-FAKE-diag \
            -e OWNER_EMAIL=owner@example.com \
            -e DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/postgres \
            --name app incisive-app:diag
          for i in $(seq 1 60); do curl -fsS localhost:8080/health >/dev/null 2>&1 && break; sleep 1; done
          docker logs app 2>&1 | tail -20
          cd .github/diag && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          node probe.js | tee probe.log
          while IFS= read -r l; do echo "::warning::${l//%/%25}"; done < probe.log
