[[q]]
id = "Q1"
question = "In patients undergoing curative resection for rectal cancer, does robotic-assisted surgery significantly reduce conversion to open surgery compared with conventional laparoscopy? Discuss the primary endpoint, absolute conversion rates, statistical significance, and clinical implications."
landmarks = [
  { pmid = "29067426", doi = "10.1001/jama.2017.7219", title_hint = "Effect of Robotic-Assisted vs Conventional Laparoscopic Surgery on Risk of Conversion" },
  { pmid = "21912876", doi = "10.1007/s00384-011-1313-6", title_hint = "An international, multicentre, prospective, randomised, controlled, unblinded, parallel-group trial of robotic" },
]

